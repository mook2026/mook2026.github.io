<!DOCTYPE html>
<html lang="ko">
<!--
  [수정 이력]
  v1. textarea → contenteditable (ce-cell) 전환
  v2. 행 높이 드래그 (rh-row) / 열 너비 드래그 (col-rz)
  v3. rowHeights/colWidths 저장/복원
  v4. table width:max-content
  v5. localStorage 먼저 렌더 후 Firebase 재렌더
  v6. 자동저장 엔진 + CE_ENGINE 툴바
  v7. table id="yt-tbl-${month}" - 월별 테이블 id 동적 생성
  [주의] updateCellCE_yt: data.rows[idx][col] = el.innerHTML
  v+. saveData()에 실제 저장됨 표시 추가 - 가짜 저장됨 버그 수정
  v+. 상단 스크롤바 sticky 고정(top:0) + nav에 💾 저장 버튼 직접 삽입
  v+. TOP SCROLL ENGINE v2 - position:fixed, nav+toolbar 높이 동적계산, overflow 부모 영향 없음
  v8. AS엔진 제거, SAVE ENGINE v2, fbSync _editing, TOP SCROLL v3
-->

<script>
const FB_CONFIG={apiKey:"AIzaSyBh9LtC02jCwyrURkl676UFxtHU2SdSkkI",authDomain:"ian-dashboard.firebaseapp.com",projectId:"ian-dashboard",storageBucket:"ian-dashboard.firebasestorage.app",messagingSenderId:"47067460467",appId:"1:47067460467:web:37906ad2ddb74133238b06"};
if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);
/* AUTH GATE - 로그인 안 됐으면 home.html로 이동 */
firebase.auth().onAuthStateChanged(function(user){if(!user)location.href='home.html';});
const db=firebase.firestore();const UID='ian';
const FB_DOC='ian_youtube';
const FB_KEYS=["youtube_review"];
const FB_PREFIXES=[];
function fbInScope(k){return FB_KEYS.includes(k)||FB_PREFIXES.some(p=>k.startsWith(p));}
async function fbSave(){try{const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&!k.startsWith('mstage_')&&fbInScope(k))d[k]=localStorage.getItem(k);}await db.collection('data').doc(FB_DOC).set(d,{merge:true});}catch(e){console.warn('FB:',e);}}
async function fbSync(cb){try{const doc=await db.collection('data').doc(FB_DOC).get();if(doc.exists){Object.entries(doc.data()).forEach(([k,v])=>localStorage.setItem(k,v));}}catch(e){console.warn('FB:',e);}if(cb)cb();}
</script>

<script>
const DEFAULT_COLS=['날짜','유튜버1','유튜버2','유튜버3'];
const FIXED_COLS=['날짜'];
const DEFAULT_W=240;
const DAYS=['일','월','화','수','목','금','토'];
const openState={cats:new Set(),years:new Set(),months:new Set(),_init:false};
let dragSrc=-1;

function pad(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function ls(k){return localStorage.getItem(k);}
function lss(k,v){localStorage.setItem(k,v);}
function showConfirm(msg){const el=document.getElementById('confirm-bar');el.textContent=msg;setTimeout(()=>el.textContent='',3000);}
function genId(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function getData(){
  const raw=ls('youtube_review');
  if(raw){
    try{
      const d=JSON.parse(raw);
      if(d.categories){ // 이미 카테고리 구조
        d.categories.forEach(c=>{if(!c.colWidths)c.colWidths={};if(!c.rowHeights)c.rowHeights={};if(!c.cols)c.cols=[...DEFAULT_COLS];if(!c.rows)c.rows=[];});
        return d;
      }
      // [자동 마이그레이션] 예전 평면 구조({cols,rows,...}) → 카테고리 구조로 1회 변환
      if(d.cols||d.rows){
        return {categories:[{id:genId(),name:'전체',cols:d.cols||[...DEFAULT_COLS],rows:d.rows||[],colWidths:d.colWidths||{},rowHeights:d.rowHeights||{}}]};
      }
    }catch(e){}
  }
  return {categories:[]};
}
function saveData(d){
  d.categories.forEach(c=>{if(!c.colWidths)c.colWidths={};if(!c.rowHeights)c.rowHeights={};});
  lss('youtube_review',JSON.stringify(d));
  if(window.fbSaveWithStatus)fbSaveWithStatus();else fbSave();
}
function getCat(data,catId){return data.categories.find(c=>c.id===catId);}

function addCategory(){
  const name=prompt('카테고리(채널/주제) 이름:');if(!name?.trim())return;
  const data=getData();
  if(data.categories.some(c=>c.name===name.trim())){showConfirm('이미 있는 카테고리');return;}
  const id=genId();
  data.categories.push({id,name:name.trim(),cols:[...DEFAULT_COLS],rows:[],colWidths:{},rowHeights:{}});
  openState.cats.add(id);
  saveData(data);render();showConfirm(name.trim()+' 카테고리 추가됨');
}
function renameCategory(catId,newName){
  if(!newName?.trim())return;
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  if(newName.trim()===cat.name)return;
  if(data.categories.some(c=>c.id!==catId&&c.name===newName.trim())){showConfirm('이미 있는 이름');render();return;}
  cat.name=newName.trim();saveData(data);
}
function deleteCategory(catId){
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  if(!confirm('"'+cat.name+'" 카테고리를 삭제할까요? 안의 모든 기록이 같이 삭제돼요.'))return;
  data.categories=data.categories.filter(c=>c.id!==catId);
  saveData(data);render();
}

function addRow(catId){
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  const row={};cat.cols.forEach(c=>row[c]='');row['날짜']=todayStr();
  cat.rows.unshift(row);saveData(data);render();
}

function addYoutuber(catId){
  const name=prompt('유튜버 이름 또는 채널명:');if(!name?.trim())return;
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  if(cat.cols.includes(name.trim())){showConfirm('이미 있어요');return;}
  cat.cols.push(name.trim());cat.rows.forEach(r=>r[name.trim()]=r[name.trim()]||'');
  saveData(data);render();showConfirm(name.trim()+' 추가됨');
}

let _ytColSrc=null,_ytColSrcCat=null;
function ytColDragStart(e,catId,col){_ytColSrc=col;_ytColSrcCat=catId;e.currentTarget.style.opacity='0.5';e.dataTransfer.effectAllowed='move';}
function ytColDragEnd(e){e.currentTarget.style.opacity='';}
function ytColDragOver(e){e.preventDefault();e.currentTarget.style.background='rgba(251,191,36,0.15)';}
function ytColDragLeave(e){e.currentTarget.style.background='';}
function ytColDragDrop(e,catId,targetCol){
  e.preventDefault();e.currentTarget.style.background='';
  if(!_ytColSrc||_ytColSrcCat!==catId||_ytColSrc===targetCol)return;
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  const si=cat.cols.indexOf(_ytColSrc),ti=cat.cols.indexOf(targetCol);
  if(si<0||ti<0)return;
  cat.cols.splice(si,1);cat.cols.splice(ti,0,_ytColSrc);
  saveData(data);render();_ytColSrc=null;_ytColSrcCat=null;
}

function renameCol(catId,col,newName){
  if(!newName?.trim()||newName===col)return;
  if(FIXED_COLS.includes(col))return;
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  if(cat.cols.includes(newName.trim())){showConfirm('이미 있는 이름');return;}
  const idx=cat.cols.indexOf(col);if(idx<0)return;
  cat.cols[idx]=newName.trim();
  cat.rows.forEach(r=>{r[newName.trim()]=r[col]||'';delete r[col];});
  if(cat.colWidths&&cat.colWidths[col]){cat.colWidths[newName.trim()]=cat.colWidths[col];delete cat.colWidths[col];}
  saveData(data);render();
}

function deleteCol(catId,col){
  if(FIXED_COLS.includes(col)){showConfirm('날짜 열은 삭제 불가');return;}
  if(!confirm('"'+col+'" 열 삭제?'))return;
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  cat.cols=cat.cols.filter(c=>c!==col);cat.rows.forEach(r=>delete r[col]);saveData(data);render();
}

function deleteRow(catId,idx){
  if(!confirm('삭제?'))return;
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  cat.rows.splice(idx,1);saveData(data);render();
}

function updateCellCE_yt(el,catId,idx,col){
  const data=getData();const cat=getCat(data,catId);if(!cat||!cat.rows[idx])return;
  cat.rows[idx][col]=el.innerHTML;
  saveData(data);
}
function updateCell(catId,idx,col,val){
  const data=getData();const cat=getCat(data,catId);if(!cat||!cat.rows[idx])return;
  cat.rows[idx][col]=val;saveData(data);
}

function dragStart(e,catId,ri){dragSrc=ri;dragSrcCat=catId;e.currentTarget.classList.add('dragging');}
let dragSrcCat=null;
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dragLeave(e){e.currentTarget.classList.remove('drag-over');}
function dragDrop(e,catId,ri){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(dragSrcCat!==catId||dragSrc===ri)return;
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  const row=cat.rows.splice(dragSrc,1)[0];cat.rows.splice(ri,0,row);
  saveData(data);render();dragSrc=-1;dragSrcCat=null;
}

function render(){
  const data=getData();
  const content=document.getElementById('content');
  const empty=document.getElementById('empty-msg');
  if(!data.categories.length){content.innerHTML='';empty.classList.remove('hidden');return;}
  empty.classList.add('hidden');
  const curYear=new Date().getFullYear().toString();
  const curMonth=new Date().getFullYear()+'-'+pad(new Date().getMonth()+1);

  content.innerHTML=data.categories.map(cat=>{
    const catId=cat.id;
    if(!openState._initCats)openState._initCats=new Set();
    if(!openState._initCats.has(catId)){openState.cats.add(catId);openState._initCats.add(catId);}
    const isCatOpen=openState.cats.has(catId);
    const cw=cat.colWidths||{};
    const cols=cat.cols;

    const byYear={};
    cat.rows.forEach((row,idx)=>{
      const date=row['날짜']||'';
      const year=date?date.slice(0,4):'미분류';
      const month=date?date.slice(0,7):'미분류';
      if(!byYear[year])byYear[year]={};
      if(!byYear[year][month])byYear[year][month]=[];
      byYear[year][month].push({row,idx});
    });
    const sortedYears=Object.keys(byYear).sort((a,b)=>b.localeCompare(a));
    const totalCat=cat.rows.length;

    const yearsHtml=sortedYears.map(year=>{
      const yKey=catId+'::'+year;
      if(!openState._initYears)openState._initYears=new Set();
      if(!openState._initYears.has(yKey)){if(year===curYear)openState.years.add(yKey);openState._initYears.add(yKey);}
      const months=byYear[year];
      const total=Object.values(months).reduce((a,b)=>a+b.length,0);
      const isYearOpen=openState.years.has(yKey);
      const sortedMonths=Object.keys(months).sort((a,b)=>b.localeCompare(a));
      return `<div class="year-group">
        <div class="year-header" onclick="toggleYear('${yKey}')">
          <div style="display:flex;align-items:center;gap:12px;"><span class="year-label">${year}년</span><span style="font-family:'DM Mono',monospace;font-size:13px;color:var(--text3);">${total}건</span></div>
          <span class="year-toggle ${isYearOpen?'open':''}">▼</span>
        </div>
        <div id="yb-${yKey}" ${isYearOpen?'':'style="display:none;"'}>
          ${sortedMonths.map(month=>{
            const mKey=catId+'::'+month;
            if(!openState._initMonths)openState._initMonths=new Set();
            if(!openState._initMonths.has(mKey)){if(month===curMonth)openState.months.add(mKey);openState._initMonths.add(mKey);}
            const mRows=months[month];
            const isMonthOpen=openState.months.has(mKey);
            const [y,m]=month.split('-');
            const tblId='yt-tbl-'+catId+'-'+month;
            const trs=mRows.map(({row,idx})=>{
              const rh=(cat.rowHeights||{})[idx]||80;
              return `<tr data-ri="${idx}" draggable="true" ondragstart="dragStart(event,'${catId}',${idx})" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dragDrop(event,'${catId}',${idx})">
                <td style="width:28px;height:${rh}px;text-align:center;vertical-align:middle;border:2px solid var(--border2);padding:2px;">
                  <span class="drag-handle">⠿</span>
                </td>
                <td data-col="날짜" style="width:${cw['날짜']||110}px;height:${rh}px;vertical-align:middle;border:2px solid var(--border2);">
                  <input type="date" value="${row['날짜']||''}" onchange="updateCell('${catId}',${idx},'날짜',this.value)">
                </td>
                ${cols.filter(c=>c!=='날짜').map(c=>`<td data-col="${c}" style="width:${cw[c]||DEFAULT_W}px;height:${rh}px;border:2px solid var(--border2);">
                  <div class="ce-cell" contenteditable="true"
                    onblur="updateCellCE_yt(this,'${catId}',${idx},'${c}')"
                    placeholder="${c} 핵심 내용...">${row[c]||''}</div>
                </td>`).join('')}
                <td style="width:52px;height:${rh}px;text-align:center;vertical-align:middle;border:2px solid var(--border2);padding:4px;">
                  <button class="del-btn" onclick="deleteRow('${catId}',${idx})">삭제</button>
                </td>
              </tr>
              <tr class="rh-row">
                <td colspan="${cols.length+2}" onmousedown="startRowResize(event,'${tblId}','${catId}',${idx})"></td>
              </tr>`;
            }).join('');
            return `<div class="month-group">
              <div class="month-header" onclick="toggleMonth('${mKey}')">
                <div style="display:flex;align-items:center;gap:10px;"><span class="month-label">${parseInt(m)}월</span><span style="font-family:'DM Mono',monospace;font-size:13px;color:var(--text3);">${mRows.length}건</span></div>
                <span class="month-toggle ${isMonthOpen?'open':''}">▼</span>
              </div>
              <div id="mb-${mKey}" ${isMonthOpen?'':'style="display:none;"'}>
                <div style="overflow-x:auto;">
                  <table class="ex-table" id="${tblId}">
                    <thead><tr>
                      <th style="width:28px;">↕</th>
                      <th data-col="날짜" style="width:${cw['날짜']||110}px;">날짜<div class="col-rz" onmousedown="startColResize(event,'${tblId}','${catId}','날짜')"></div></th>
                       ${cols.filter(c=>c!=='날짜').map(c=>`<th data-col="${c}" style="width:${cw[c]||DEFAULT_W}px;position:relative;cursor:grab;"
                         draggable="true"
                         ondragstart="ytColDragStart(event,'${catId}','${c}')"
                         ondragover="ytColDragOver(event)"
                         ondragleave="ytColDragLeave(event)"
                         ondrop="ytColDragDrop(event,'${catId}','${c}')"
                         ondragend="ytColDragEnd(event)">
                         <input style="background:transparent;border:none;color:var(--text2);font-family:'DM Mono',monospace;font-size:12px;outline:none;width:calc(100% - 22px);cursor:text;"
                           value="${c.replace(/"/g,'&quot;')}" onblur="renameCol('${catId}','${c}',this.value)" onclick="event.stopPropagation()"/>
                         <span onclick="deleteCol('${catId}','${c}')" style="cursor:pointer;color:var(--text3);font-size:11px;position:absolute;right:18px;top:50%;transform:translateY(-50%);">✕</span>
                         <div class="col-rz" onmousedown="startColResize(event,'${tblId}','${catId}','${c}')"></div>
                       </th>`).join('')}
                      <th style="width:52px;"></th>
                    </tr></thead>
                    <tbody>${trs}</tbody>
                  </table>
                </div>
                <button class="add-row-btn" onclick="addRow('${catId}')">+ 행 추가</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');

    return `<div class="cat-group">
      <div class="cat-header">
        <div class="cat-label-wrap" onclick="toggleCategory('${catId}')" style="cursor:pointer;flex:1;">
          <span class="cat-toggle ${isCatOpen?'open':''}">▼</span>
          <span class="cat-label" contenteditable="true" onblur="renameCategory('${catId}',this.textContent)" onclick="event.stopPropagation()">${cat.name}</span>
          <span style="font-family:'DM Mono',monospace;font-size:13px;color:var(--text3);">${totalCat}건</span>
        </div>
        <div class="cat-actions">
          <button class="btn" onclick="addRow('${catId}')">+ 행 추가</button>
          <button class="btn" onclick="addYoutuber('${catId}')">+ 유튜버 추가</button>
          <label class="btn" style="cursor:pointer;">📂 가져오기<input type="file" accept=".xlsx,.xls" style="display:none;" onchange="importExcel(this,'${catId}')"></label>
          <button class="btn" onclick="exportExcelCat('${catId}')">⬇</button>
          <span class="del-btn" onclick="deleteCategory('${catId}')">카테고리 삭제</span>
        </div>
      </div>
      <div class="cat-body" id="cb-${catId}" ${isCatOpen?'':'style="display:none;"'}>
        ${totalCat?yearsHtml:'<div style="padding:16px;color:var(--text3);font-family:\'DM Mono\',monospace;font-size:13px;">이 카테고리에 기록이 없어요. "+ 행 추가"로 시작하세요.</div>'}
      </div>
    </div>`;
  }).join('');
  setTimeout(function(){if(window.initAllTopScrolls)window.initAllTopScrolls();},50);
}

function toggleCategory(catId){
  if(openState.cats.has(catId))openState.cats.delete(catId);else openState.cats.add(catId);
  const b=document.getElementById('cb-'+catId),t=b.previousElementSibling.querySelector('.cat-toggle');
  b.style.display=openState.cats.has(catId)?'block':'none';t.classList.toggle('open',openState.cats.has(catId));
}
function toggleYear(yKey){
  if(openState.years.has(yKey))openState.years.delete(yKey);else openState.years.add(yKey);
  const b=document.getElementById('yb-'+yKey),t=b.previousElementSibling.querySelector('.year-toggle');
  b.style.display=openState.years.has(yKey)?'block':'none';t.classList.toggle('open',openState.years.has(yKey));
}
function toggleMonth(mKey){
  if(openState.months.has(mKey))openState.months.delete(mKey);else openState.months.add(mKey);
  const b=document.getElementById('mb-'+mKey),t=b.previousElementSibling.querySelector('.month-toggle');
  b.style.display=openState.months.has(mKey)?'block':'none';t.classList.toggle('open',openState.months.has(mKey));
}

function sheetSafeName(name){
  // 엑셀 시트명 제한: 31자 이내, \/?*[]: 문자 금지
  return (name||'시트').replace(/[\\/?*\[\]:]/g,'_').slice(0,31)||'시트';
}
function exportExcelCat(catId){
  const data=getData();const cat=getCat(data,catId);if(!cat)return;
  if(!cat.rows.length){showConfirm('데이터가 없어요');return;}
  const rows=[cat.cols,...cat.rows.map(r=>cat.cols.map(c=>r[c]||''))];
  const ws=XLSX.utils.aoa_to_sheet(rows);const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheetSafeName(cat.name),ws);
  const d=new Date();XLSX.writeFile(wb,'유튜브복기_'+cat.name+'_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.xlsx');
  showConfirm('다운로드 완료!');
}
function exportExcelAll(){
  const data=getData();if(!data.categories.length){showConfirm('데이터가 없어요');return;}
  const wb=XLSX.utils.book_new();
  const usedNames=new Set();
  data.categories.forEach(cat=>{
    let name=sheetSafeName(cat.name),i=2;
    while(usedNames.has(name)){name=sheetSafeName(cat.name+i);i++;}
    usedNames.add(name);
    const rows=[cat.cols,...cat.rows.map(r=>cat.cols.map(c=>r[c]||''))];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb,name,ws);
  });
  const d=new Date();XLSX.writeFile(wb,'유튜브복기_전체_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.xlsx');
  showConfirm('전체 다운로드 완료!');
}
function importExcel(input,catId){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const wb=XLSX.read(e.target.result,{type:'binary'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rawRows=XLSX.utils.sheet_to_json(ws,{header:1});
    if(rawRows.length<2){showConfirm('데이터가 없어요');return;}
    const headers=rawRows[0].map(h=>String(h||'').trim());
    const data=getData();const cat=getCat(data,catId);if(!cat){input.value='';return;}
    headers.forEach(h=>{if(h&&!cat.cols.includes(h))cat.cols.push(h);});
    rawRows.slice(1).forEach(row=>{
      if(!row.some(v=>v))return;
      const r={};cat.cols.forEach(c=>r[c]='');
      headers.forEach((h,i)=>{if(h&&row[i]!==undefined)r[h]=String(row[i]);});
      cat.rows.push(r);
    });
    saveData(data);render();showConfirm('가져오기 완료!');
  };
  reader.readAsBinaryString(file);input.value='';
}

const d=new Date();
document.getElementById('nav-date').textContent=d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+DAYS[d.getDay()];
/* [수정] localStorage 먼저 렌더 → Firebase 재렌더 */
render();
fbSync(()=>{
  if(window._editing)return;
  render();
  setTimeout(function(){if(window.initAllTopScrolls)window.initAllTopScrolls();},100);
});
</script>
<script>
/* ============================================================
   EXCEL RESIZE ENGINE v2
   핵심 원칙:
   - tr에 height 주지 않음 (브라우저가 무시함)
   - td에 height 적용 → 행 높이 제어
   - textarea는 height:100% + min-height + overflow-y:auto
   - 열 너비: 해당 data-col 요소만 변경, 타 열 불변
   - 테이블: width:auto, table-layout:fixed → 제약 없이 확장
   ============================================================ */

// ---- 열 너비 드래그 ----
let _CZ_col='', _CZ_startX=0, _CZ_startW=0, _CZ_tableId='', _CZ_catId='', _CZ_el=null;
function startColResize(e, tableId, catId, col) {
  e.preventDefault(); e.stopPropagation();
  _CZ_col=col; _CZ_startX=e.clientX; _CZ_tableId=tableId; _CZ_catId=catId; _CZ_el=e.target;
  const tbl=document.getElementById(tableId);
  const th=tbl?tbl.querySelector('th[data-col="'+col+'"]'):null;
  _CZ_startW=th?th.offsetWidth:120;
  _CZ_el.classList.add('rz-active');
  const mm=ev=>{
    const nw=Math.max(30, _CZ_startW+(ev.clientX-_CZ_startX));
    const t=document.getElementById(_CZ_tableId);
    if(!t)return;
    // 해당 열만 변경
    t.querySelectorAll('[data-col="'+_CZ_col+'"]').forEach(el=>{ el.style.width=nw+'px'; });
    // 테이블 전체 width = 모든 th 너비 합산 → 다른 열 절대 영향 없음
    let total=0;
    t.querySelectorAll('thead th').forEach(th=>{ total+=th.offsetWidth; });
    t.style.width=total+'px';
  };
  const mu=()=>{
    _CZ_el.classList.remove('rz-active');
    document.removeEventListener('mousemove',mm);
    document.removeEventListener('mouseup',mu);
    const t=document.getElementById(_CZ_tableId);
    const th2=t?t.querySelector('th[data-col="'+_CZ_col+'"]'):null;
    if(!th2)return;
    const data=getData();const cat=getCat(data,_CZ_catId);if(!cat)return;
    if(!cat.colWidths)cat.colWidths={};
    cat.colWidths[_CZ_col]=th2.offsetWidth; saveData(data);
  };
  document.addEventListener('mousemove',mm);
  document.addEventListener('mouseup',mu);
}

// ---- 행 높이 드래그 ----
// rh-row의 td에 onmousedown="startRowResize(event, tableId, catId, rowDataIdx)"
// rowDataIdx: 데이터 배열의 인덱스 (rh-row 위 데이터 행의 논리 인덱스)
let _RZ_rowIdx=-1, _RZ_startY=0, _RZ_startH=0, _RZ_tableId='', _RZ_catId='';
function startRowResize(e, tableId, catId, rowDataIdx) {
  e.preventDefault();
  _RZ_rowIdx=rowDataIdx; _RZ_startY=e.clientY; _RZ_tableId=tableId; _RZ_catId=catId;
  // 현재 높이: 해당 rh-row 바로 위 tr의 첫번째 td height
  const tbl=document.getElementById(tableId);
  // id로 정확히 찾음: tr[data-ri="rowDataIdx"]
  const dataTr=tbl?tbl.querySelector('tr[data-ri="'+rowDataIdx+'"]'):null;
  const firstTd=dataTr?dataTr.querySelector('td'):null;
  _RZ_startH=firstTd?firstTd.offsetHeight:80;

  const mm=ev=>{
    const newH=Math.max(32, _RZ_startH+(ev.clientY-_RZ_startY));
    const t=document.getElementById(_RZ_tableId);
    const dTr=t?t.querySelector('tr[data-ri="'+_RZ_rowIdx+'"]'):null;
    if(dTr){
      // 모든 td에 height 적용
      dTr.querySelectorAll('td').forEach(td=>{ td.style.height=newH+'px'; });
      // textarea는 height:100%로 자동 따라옴 (CSS에서 설정)
    }
  };
  const mu=()=>{
    document.removeEventListener('mousemove',mm);
    document.removeEventListener('mouseup',mu);
    const t=document.getElementById(_RZ_tableId);
    const dTr=t?t.querySelector('tr[data-ri="'+_RZ_rowIdx+'"]'):null;
    const td1=dTr?dTr.querySelector('td'):null;
    if(td1){
      const data=getData();const cat=getCat(data,_RZ_catId);if(!cat)return;
      if(!cat.rowHeights)cat.rowHeights={};
      cat.rowHeights[_RZ_rowIdx]=td1.offsetHeight; saveData(data);
    }
    _RZ_rowIdx=-1;
  };
  document.addEventListener('mousemove',mm);
  document.addEventListener('mouseup',mu);
}

</script>
<script>
/* ============================================================
   CONTENTEDITABLE RICH TEXT ENGINE
   - 텍스트 선택 후 미니 툴바: 볼드, 글자색, 형광펜
   - 저장: innerHTML (기존 plain text도 그대로 읽힘)
   - 툴바는 선택 영역 위에 자동 위치
   ============================================================ */

(function(){
  const TOOLBAR_ID = 'ce-toolbar';
  const COLORS = ['#fbbf24','#fb7185','#34d399','#60a5fa','#a78bfa','#f97316','#ffffff','#000000'];
  const HIGHLIGHTS = ['#fbbf2440','#fb718540','#34d39940','#60a5fa40','#a78bfa40','rgba(251,191,36,0.35)','rgba(251,113,133,0.35)','rgba(52,211,153,0.35)'];

  function getOrCreateToolbar(){
    let tb = document.getElementById(TOOLBAR_ID);
    if(tb) return tb;
    tb = document.createElement('div');
    tb.id = TOOLBAR_ID;
    tb.style.cssText = `
      position:fixed;z-index:9999;
      background:#1c1c1f;border:1px solid rgba(255,255,255,0.25);
      border-radius:8px;padding:6px 8px;
      display:none;flex-wrap:wrap;gap:4px;align-items:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.5);
      max-width:320px;
    `;

    // 볼드
    const bold = document.createElement('button');
    bold.textContent = 'B';
    bold.style.cssText = 'font-weight:700;font-size:13px;background:transparent;border:1px solid rgba(255,255,255,0.2);color:#f0f0f0;border-radius:4px;padding:3px 8px;cursor:pointer;font-family:DM Mono,monospace;';
    bold.title = '볼드';
    bold.onmousedown = e => { e.preventDefault(); document.execCommand('bold'); };
    tb.appendChild(bold);

    // 구분선
    const sep1 = document.createElement('div');
    sep1.style.cssText = 'width:1px;height:18px;background:rgba(255,255,255,0.2);';
    tb.appendChild(sep1);

    // 글자색 라벨
    const lbl1 = document.createElement('span');
    lbl1.textContent = 'A';
    lbl1.style.cssText = 'font-size:11px;color:#999;font-family:DM Mono,monospace;';
    tb.appendChild(lbl1);

    // 글자색 팔레트
    COLORS.forEach(c => {
      const dot = document.createElement('button');
      dot.style.cssText = `width:16px;height:16px;border-radius:50%;background:${c};border:1px solid rgba(255,255,255,0.3);cursor:pointer;padding:0;flex-shrink:0;`;
      dot.title = c;
      dot.onmousedown = e => { e.preventDefault(); document.execCommand('foreColor', false, c); };
      tb.appendChild(dot);
    });

    // 구분선
    const sep2 = document.createElement('div');
    sep2.style.cssText = 'width:1px;height:18px;background:rgba(255,255,255,0.2);';
    tb.appendChild(sep2);

    // 형광펜 라벨
    const lbl2 = document.createElement('span');
    lbl2.style.cssText = 'font-size:13px;color:#999;';
    lbl2.textContent = '🖍';
    tb.appendChild(lbl2);

    // 형광펜 팔레트
    HIGHLIGHTS.forEach(c => {
      const dot = document.createElement('button');
      dot.style.cssText = `width:16px;height:16px;border-radius:3px;background:${c};border:1px solid rgba(255,255,255,0.3);cursor:pointer;padding:0;flex-shrink:0;`;
      dot.title = '형광펜';
      dot.onmousedown = e => {
        e.preventDefault();
        document.execCommand('hiliteColor', false, c);
      };
      tb.appendChild(dot);
    });

    // 구분선
    const sep3 = document.createElement('div');
    sep3.style.cssText = 'width:1px;height:18px;background:rgba(255,255,255,0.2);';
    tb.appendChild(sep3);

    // 서식 제거
    const clr = document.createElement('button');
    clr.textContent = '✕';
    clr.title = '서식 제거';
    clr.style.cssText = 'font-size:12px;background:transparent;border:1px solid rgba(255,255,255,0.2);color:#999;border-radius:4px;padding:3px 7px;cursor:pointer;';
    clr.onmousedown = e => { e.preventDefault(); document.execCommand('removeFormat'); };
    tb.appendChild(clr);

    document.body.appendChild(tb);
    tb.style.display = 'flex';
    tb.style.display = 'none';
    return tb;
  }

  function showToolbar(){
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || !sel.toString().trim()) { hideToolbar(); return; }
    // contenteditable 안에서만
    let node = sel.anchorNode;
    while(node && node.nodeType !== 1) node = node.parentNode;
    if(!node || !node.closest('[contenteditable="true"]')) { hideToolbar(); return; }

    const tb = getOrCreateToolbar();
    const range = sel.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    tb.style.display = 'flex';
    const tbW = tb.offsetWidth || 300;
    let left = rect.left + (rect.width/2) - (tbW/2);
    let top = rect.top - tb.offsetHeight - 8 + window.scrollY;
    if(left < 4) left = 4;
    if(left + tbW > window.innerWidth - 4) left = window.innerWidth - tbW - 4;
    if(top < window.scrollY + 4) top = rect.bottom + 8 + window.scrollY;
    tb.style.left = left + 'px';
    tb.style.top = top + 'px';
  }

  function hideToolbar(){
    const tb = document.getElementById(TOOLBAR_ID);
    if(tb) tb.style.display = 'none';
  }

  document.addEventListener('mouseup', () => setTimeout(showToolbar, 10));
  document.addEventListener('keyup', () => setTimeout(showToolbar, 10));
  document.addEventListener('mousedown', e => {
    const tb = document.getElementById(TOOLBAR_ID);
    if(tb && !tb.contains(e.target)) hideToolbar();
  });
  document.addEventListener('scroll', hideToolbar, true);

  window.CE_ENGINE_LOADED = true;
})();

</script>


<script>
/* ============================================================
   SAVE ENGINE v2 - 수동저장만 / 자동저장 없음
   - 💾 버튼: 모든 CE셀 innerHTML 수집 → localStorage → Firebase
   - 실제 Firebase 완료 후에만 ✅ 저장됨 표시
   - 가짜 저장됨 표시 없음
   ============================================================ */
(function(){
  function pad(n){return String(n).padStart(2,'0');}
  function nowTime(){const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}

  function getBar(){
    let bar=document.getElementById('save-status-bar');
    if(bar)return bar;
    bar=document.createElement('div');
    bar.id='save-status-bar';
    bar.style.cssText='position:fixed;bottom:0;left:0;right:0;height:30px;background:#141416;border-top:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:9998;font-family:\'DM Mono\',monospace;font-size:12px;color:#888;';
    bar.innerHTML='<span id="save-status-msg">준비됨</span>'
      +'<button onclick="window.manualSave&&window.manualSave()" style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);border-radius:4px;color:#fbbf24;font-size:12px;padding:3px 10px;cursor:pointer;font-family:\'DM Mono\',monospace;">💾 저장</button>';
    document.body.appendChild(bar);
    document.body.style.paddingBottom='38px';
    return bar;
  }
  function setMsg(msg,color){
    getBar();
    const el=document.getElementById('save-status-msg');
    if(el){el.textContent=msg;el.style.color=color||'#888';}
  }
  window.manualSave=async function(){
    setMsg('저장 중...','#fbbf24');
    try{
      const active=document.activeElement;
      if(active&&active.classList&&active.classList.contains('ce-cell'))active.blur();
      const d={};
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&!k.startsWith('mstage_')&&fbInScope(k))d[k]=localStorage.getItem(k);}
      if(!Object.keys(d).length){setMsg('저장할 데이터 없음','#fb7185');return;}
      if(typeof db!=='undefined'&&typeof UID!=='undefined'){
        await db.collection('data').doc(FB_DOC).set(d,{merge:true});
        setMsg('✅ 저장됨 '+nowTime(),'#34d399');
      }else{
        setMsg('✅ 로컬 저장됨 '+nowTime(),'#fbbf24');
      }
    }catch(e){
      setMsg('❌ 저장 실패: '+e.message,'#fb7185');
      console.error('저장 실패:',e);
    }
  };
  window.fbSaveWithStatus=window.manualSave;
  /* CE셀 포커스 추적 - fbSync 재렌더 방지용 */
  document.addEventListener('focusin',function(e){
    if(e.target.classList&&e.target.classList.contains('ce-cell'))window._editing=true;
  });
  document.addEventListener('focusout',function(e){
    if(e.target.classList&&e.target.classList.contains('ce-cell')){
      setTimeout(function(){if(!document.querySelector('.ce-cell:focus'))window._editing=false;},150);
    }
  });
  window.SAVE_ENGINE_LOADED=true;
  setTimeout(function(){getBar();setMsg('준비됨','#888');},300);
})();
</script>
<script>
/* ============================================================
   TOP SCROLL ENGINE v3
   - position:fixed, nav+toolbar 높이 동적계산
   - 셀렉터 확대: .tbl-outer, .tbl-wrap, id*=tbl, div[overflow-x:auto]
   ============================================================ */
(function(){
  let activeWrap=null,syncing=false;
  function getNavBottom(){
    const nav=document.querySelector('.nav'),tb=document.querySelector('.toolbar');
    let top=nav?nav.getBoundingClientRect().bottom:56;
    if(tb){const r=tb.getBoundingClientRect();if(r.top<=top+2)top=r.bottom;}
    return Math.round(top);
  }
  function getOrCreateBar(){
    let bar=document.getElementById('top-scroll-fixed');
    if(bar)return bar;
    bar=document.createElement('div');
    bar.id='top-scroll-fixed';
    bar.style.cssText='position:fixed;left:0;right:0;height:14px;overflow-x:auto;overflow-y:hidden;z-index:998;background:#1c1c1f;border-bottom:2px solid rgba(251,191,36,0.3);display:none;cursor:pointer;';
    const dummy=document.createElement('div');
    dummy.id='top-scroll-dummy';dummy.style.height='1px';
    bar.appendChild(dummy);document.body.appendChild(bar);
    bar.addEventListener('scroll',function(){
      if(syncing||!activeWrap)return;
      syncing=true;activeWrap.scrollLeft=bar.scrollLeft;syncing=false;
    });
    return bar;
  }
  function syncBar(wrap){
    const bar=getOrCreateBar(),dummy=document.getElementById('top-scroll-dummy');
    const tbl=wrap.querySelector('table');
    if(!tbl){bar.style.display='none';return;}
    activeWrap=wrap;
    dummy.style.width=tbl.scrollWidth+'px';
    bar.scrollLeft=wrap.scrollLeft;
    bar.style.top=getNavBottom()+'px';
    bar.style.display=tbl.scrollWidth>wrap.clientWidth?'block':'none';
  }
  window.initTopScrollFixed=function(el){
    if(!el||el.dataset.tsFixed)return;
    el.dataset.tsFixed='1';
    el.addEventListener('scroll',function(){
      if(syncing)return;syncing=true;
      const bar=document.getElementById('top-scroll-fixed');
      if(bar)bar.scrollLeft=el.scrollLeft;
      syncing=false;
    });
    /* mouseenter + 스크롤 위치 기반으로 활성 테이블 감지 */
    el.addEventListener('mouseenter',function(){syncBar(el);});
    el.addEventListener('focusin',function(){syncBar(el);});
    el.addEventListener('click',function(){syncBar(el);});
    const obs=new ResizeObserver(function(){if(activeWrap===el)syncBar(el);});
    const tbl=el.querySelector('table');if(tbl)obs.observe(tbl);
    syncBar(el);
  };
  window.initAllTopScrolls=function(){
    document.querySelectorAll('.tbl-outer,.tbl-wrap,.ex-table-wrap').forEach(function(el){
      if(el.querySelector('table'))window.initTopScrollFixed(el);
    });
    document.querySelectorAll('[id*="tbl-outer"],[id*="tbl-wrap"],[id*="tbl-outer-s"]').forEach(function(el){
      if(el.querySelector('table'))window.initTopScrollFixed(el);
    });
    document.querySelectorAll('div').forEach(function(el){
      if(el.style&&el.style.overflowX==='auto'&&el.querySelector('table'))window.initTopScrollFixed(el);
    });
    /* 페이지 스크롤 시 현재 화면에 보이는 테이블 자동 감지 */
    window.addEventListener('scroll',function(e){
      if(syncing)return;
      const bar=document.getElementById('top-scroll-fixed');
      if(!bar)return;
      /* 고정 스크롤바 자체를 드래그해서 난 스크롤 이벤트는 무시(재감지 로직과 충돌 방지) */
      if(e.target===bar||(e.target&&e.target.id==='top-scroll-fixed'))return;
      /* 화면에 보이는 overflow-x:auto div 중 테이블 있는 것 찾기 */
      let found=null;
      document.querySelectorAll('.tbl-outer,.tbl-wrap,.ex-table-wrap,div[style]').forEach(function(el){
        if(!el.querySelector('table'))return;
        if(el.style&&el.style.overflowX!=='auto'&&!el.classList.contains('tbl-outer')&&!el.classList.contains('tbl-wrap')&&!el.classList.contains('ex-table-wrap'))return;
        const r=el.getBoundingClientRect();
        if(r.top<window.innerHeight&&r.bottom>0){found=el;}
      });
      if(found&&found!==activeWrap)syncBar(found);
    },true);
  };
  window.TOP_SCROLL_V3_LOADED=true;
})();
</script>
</body>
</html>
